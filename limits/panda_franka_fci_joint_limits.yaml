# Franka Emika Panda joint-space interface limits.
#
# Primary source:
#   Franka Control Interface documentation, "Robot and interface specifications"
#   https://frankaemika.github.io/docs/control_parameters.html
#
# These are Panda interface limits, not the more conservative planning limits
# distributed by some MoveIt/Robowflex configurations.
#
# Units:
#   velocity: rad/s
#   acceleration: rad/s^2
#   jerk: rad/s^3
#   torque: Nm (documented here for provenance; URDF effort remains dynamics input)
#   torque_rate: Nm/s

joint_limits:
  panda_joint1:
    has_velocity_limits: true
    max_velocity: 2.175
    has_acceleration_limits: true
    max_acceleration: 15.0
    has_jerk_limits: true
